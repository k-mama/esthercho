name: Italian local browser smoke (not production)

on:
  push:
    branches:
      - feature/multilingual-foundation-20261118
    paths:
      - src/components/international-pages.tsx
      - src/components/international-pages.module.css
      - src/i18n/translations/it.ts
      - src/i18n/path.ts
      - src/i18n/translations/types.ts
      - src/app/it/stories/**
      - .github/workflows/it-local-browser.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Render unpublished Italian pages in local headless browser
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          python3 -m http.server 8777 --directory out >/tmp/it-local-server.log 2>&1 &
          sleep 2
          mkdir -p .reports/it-browser
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1380,900 --virtual-time-budget=2300 --screenshot=.reports/it-browser/home-desktop.png "http://127.0.0.1:8777/it/"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=2300 --screenshot=.reports/it-browser/home-mobile.png "http://127.0.0.1:8777/it/"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1380,900 --virtual-time-budget=2300 --screenshot=.reports/it-browser/stories-desktop.png "http://127.0.0.1:8777/it/stories/"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1380,900 --virtual-time-budget=2300 --screenshot=.reports/it-browser/books-desktop.png "http://127.0.0.1:8777/it/books/"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1380,900 --virtual-time-budget=2300 --screenshot=.reports/it-browser/about-desktop.png "http://127.0.0.1:8777/it/about/"
          test -s .reports/it-browser/home-desktop.png
          test -s .reports/it-browser/home-mobile.png
          test -s .reports/it-browser/stories-desktop.png
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1380,1800 --virtual-time-budget=2300 --screenshot=.reports/it-browser/books-first-edition.png "http://127.0.0.1:8777/it/books/"
          test -s .reports/it-browser/books-first-edition.png
          test -s .reports/it-browser/books-desktop.png
          test -s .reports/it-browser/about-desktop.png
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1380,900 --virtual-time-budget=2300 --screenshot=.reports/it-browser/tiger-desktop.png "http://127.0.0.1:8777/it/stories/my-father-dreamed-of-a-tiger/"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=2300 --screenshot=.reports/it-browser/daughter-mobile.png "http://127.0.0.1:8777/it/stories/the-youngest-daughter-in-every-house/"
          test -s .reports/it-browser/tiger-desktop.png
          test -s .reports/it-browser/daughter-mobile.png
      - name: Emit small visual proof for editorial inspection
        run: |
          python3 -m pip -q install Pillow
          python3 - <<'PY'
          import base64,io
          from PIL import Image
          from pathlib import Path
          for name in ("home-desktop","home-mobile","stories-desktop","books-desktop","books-first-edition","about-desktop","tiger-desktop","daughter-mobile"):
              img=Image.open(Path(".reports/it-browser")/(name+".png")).convert("RGB")
              img.thumbnail((960,760))
              buf=io.BytesIO()
              img.save(buf,format="JPEG",quality=55,optimize=True)
              print("IT_PREVIEW_BEGIN:"+name+":"+base64.b64encode(buf.getvalue()).decode()+":IT_PREVIEW_END")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: it-unpublished-browser-previews
          path: .reports/it-browser/*.png
          retention-days: 14
