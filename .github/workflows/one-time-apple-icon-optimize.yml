name: One-time Apple Icon Optimize

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-apple-icon-optimize.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Optimize Apple touch icon
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path("src/app/apple-icon.png")
          before = path.stat().st_size

          with Image.open(path) as image:
              width, height = image.size
              print(f"Original: {width}x{height}, {before} bytes")

              longest = max(width, height)
              difference = abs(width - height) / longest
              if difference > 0.05:
                  raise SystemExit(
                      "Apple icon is more than 5% off square; refusing automatic padding."
                  )

              source = image.convert("RGBA")
              fill = source.getpixel((0, 0))
              canvas = Image.new("RGBA", (longest, longest), fill)
              offset = ((longest - width) // 2, (longest - height) // 2)
              canvas.paste(source, offset, source)

              optimized = canvas.resize(
                  (180, 180), Image.Resampling.LANCZOS
              )
              optimized.save(path, format="PNG", optimize=True, compress_level=9)

          after = path.stat().st_size
          print(f"Optimized: 180x180, {after} bytes")
          if after >= before:
              raise SystemExit("Optimized icon is not smaller; refusing commit.")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified icon
        run: |
          if git diff --quiet -- src/app/apple-icon.png; then
            echo "No icon change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/apple-icon.png
          git commit -m "perf: optimize Apple touch icon"
          git push origin main
