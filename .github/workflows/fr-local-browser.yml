name: French local browser smoke (not production)

on:
  push:
    branches:
      - feature/multilingual-foundation-20261118
    paths:
      - src/components/international-pages.tsx
      - src/components/international-pages.module.css
      - src/i18n/translations/fr.ts
      - src/i18n/path.ts
      - src/i18n/translations/types.ts
      - src/app/fr/stories/**
      - .github/workflows/fr-local-browser.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Render unpublished French pages in local headless browser
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          python3 -m http.server 8777 --directory out >/tmp/fr-local-server.log 2>&1 &
          sleep 2
          mkdir -p .reports/fr-browser
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1380,900 --virtual-time-budget=2300 --screenshot=.reports/fr-browser/home-desktop.png "http://127.0.0.1:8777/fr/"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=2300 --screenshot=.reports/fr-browser/home-mobile.png "http://127.0.0.1:8777/fr/"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1380,900 --virtual-time-budget=2300 --screenshot=.reports/fr-browser/stories-desktop.png "http://127.0.0.1:8777/fr/stories/"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1380,900 --virtual-time-budget=2300 --screenshot=.reports/fr-browser/books-desktop.png "http://127.0.0.1:8777/fr/books/"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1380,900 --virtual-time-budget=2300 --screenshot=.reports/fr-browser/about-desktop.png "http://127.0.0.1:8777/fr/about/"
          test -s .reports/fr-browser/home-desktop.png
          test -s .reports/fr-browser/home-mobile.png
          test -s .reports/fr-browser/stories-desktop.png
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1380,1800 --virtual-time-budget=2300 --screenshot=.reports/fr-browser/books-first-edition.png "http://127.0.0.1:8777/fr/books/"
          test -s .reports/fr-browser/books-first-edition.png
          test -s .reports/fr-browser/books-desktop.png
          test -s .reports/fr-browser/about-desktop.png
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1380,900 --virtual-time-budget=2300 --screenshot=.reports/fr-browser/tiger-desktop.png "http://127.0.0.1:8777/fr/stories/my-father-dreamed-of-a-tiger/"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=2300 --screenshot=.reports/fr-browser/daughter-mobile.png "http://127.0.0.1:8777/fr/stories/the-youngest-daughter-in-every-house/"
          test -s .reports/fr-browser/tiger-desktop.png
          test -s .reports/fr-browser/daughter-mobile.png
      - name: Emit small visual proof for editorial inspection
        run: |
          python3 -m pip -q install Pillow
          python3 - <<'PY'
          import base64,io
          from PIL import Image
          from pathlib import Path
          for name in ("home-desktop","home-mobile","stories-desktop","books-desktop","books-first-edition","about-desktop","tiger-desktop","daughter-mobile"):
              img=Image.open(Path(".reports/fr-browser")/(name+".png")).convert("RGB")
              img.thumbnail((960,760))
              buf=io.BytesIO()
              img.save(buf,format="JPEG",quality=55,optimize=True)
              print("FR_PREVIEW_BEGIN:"+name+":"+base64.b64encode(buf.getvalue()).decode()+":FR_PREVIEW_END")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: fr-unpublished-browser-previews
          path: .reports/fr-browser/*.png
          retention-days: 14
