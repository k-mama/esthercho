name: Quality

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sprint 0 census
        run: npm run audit:census

      - name: CSS important guard
        run: npm run guard:css-important

      - name: CSS file architecture guard
        run: npm run guard:css-files

      - name: Cho Sungyeon romanization guard
        run: |
          if grep -Rni --include='*.ts' --include='*.tsx' --include='*.mdx' --include='*.json' 'Seongyeon' src; then
            echo 'Deprecated author romanization found in website source. Use Cho Sungyeon.'
            exit 1
          fi
          echo 'Cho Sungyeon romanization guard passed'

      - name: Upload census report
        uses: actions/upload-artifact@v5
        with:
          name: sprint0-census
          path: .reports/sprint0-*
          retention-days: 14
          include-hidden-files: true

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
