name: PT-BR local browser smoke (not production)

on:
  push:
    branches:
      - feature/multilingual-foundation-20261118
    paths:
      - src/components/international-pages.tsx
      - src/components/international-pages.module.css
      - src/i18n/translations/pt-br.ts
      - src/i18n/translations/types.ts
      - .github/workflows/pt-br-local-browser.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Render unpublished PT-BR pages in local headless browser
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          python3 -m http.server 8777 --directory out >/tmp/ptbr-local-server.log 2>&1 &
          sleep 2
          mkdir -p .reports/ptbr-browser
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1380,900 --virtual-time-budget=2300 --screenshot=.reports/ptbr-browser/home-desktop.png "http://127.0.0.1:8777/pt-br/"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=2300 --screenshot=.reports/ptbr-browser/home-mobile.png "http://127.0.0.1:8777/pt-br/"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1380,900 --virtual-time-budget=2300 --screenshot=.reports/ptbr-browser/stories-desktop.png "http://127.0.0.1:8777/pt-br/stories/"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1380,900 --virtual-time-budget=2300 --screenshot=.reports/ptbr-browser/books-desktop.png "http://127.0.0.1:8777/pt-br/books/"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1380,900 --virtual-time-budget=2300 --screenshot=.reports/ptbr-browser/about-desktop.png "http://127.0.0.1:8777/pt-br/about/"
          test -s .reports/ptbr-browser/home-desktop.png
          test -s .reports/ptbr-browser/home-mobile.png
          test -s .reports/ptbr-browser/stories-desktop.png
          test -s .reports/ptbr-browser/books-desktop.png
          test -s .reports/ptbr-browser/about-desktop.png
      - name: Emit small visual proof for editorial inspection
        run: |
          python3 -m pip -q install Pillow
          python3 - <<'PY'
          import base64,io
          from PIL import Image
          from pathlib import Path
          for name in ("home-desktop","home-mobile","stories-desktop","books-desktop","about-desktop"):
              img=Image.open(Path(".reports/ptbr-browser")/(name+".png")).convert("RGB")
              img.thumbnail((960,760))
              buf=io.BytesIO()
              img.save(buf,format="JPEG",quality=55,optimize=True)
              print("PTBR_PREVIEW_BEGIN:"+name+":"+base64.b64encode(buf.getvalue()).decode()+":PTBR_PREVIEW_END")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: ptbr-unpublished-browser-previews
          path: .reports/ptbr-browser/*.png
          retention-days: 14
