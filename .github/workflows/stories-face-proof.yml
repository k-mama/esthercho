name: Preview face-only restoration on the original Stories photo
on:
  push:
    branches:
      - preview/stories-face-original
    paths:
      - .github/workflows/stories-face-proof.yml
      - scripts/stories-face-composite.py
      - preview-input/stories-face-reference.jpg
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out original website photography
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Image processing dependencies
        run: python -m pip install 'numpy==1.26.4' 'opencv-python-headless==4.10.0.84'
      - name: Composite only actual facial pixels onto the real Stories cover
        run: |
          python scripts/stories-face-composite.py \
            public/media/covers/stories-cover.jpg \
            preview-input/stories-face-reference.jpg \
            public/media/covers/stories-cover-faceproof.jpg
      - name: Save review-only image to preview branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/covers/stories-cover-faceproof.jpg
          git diff --cached --quiet || (git commit -m "Render face-only Stories source-photo proof" && git push)
