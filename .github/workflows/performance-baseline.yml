name: Performance Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/performance-baseline.mjs
      - .github/workflows/performance-baseline.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Install pinned Lighthouse runtime
        run: npm install --no-save --package-lock=false lighthouse@13.4.1

      - name: Verify Chrome
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          else
            echo "Chrome was not found on the GitHub runner."
            exit 1
          fi

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/esther-perf-server.log 2>&1 &
          echo $! > /tmp/esther-perf-server.pid
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/home/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/esther-perf-server.log
          exit 1

      - name: Capture Lighthouse baseline
        env:
          PERF_BASE_URL: http://127.0.0.1:4173
        run: node scripts/performance-baseline.mjs

      - name: Upload performance baseline
        uses: actions/upload-artifact@v5
        with:
          name: performance-baseline-${{ github.sha }}
          path: .reports/performance/
          retention-days: 30
          include-hidden-files: true
