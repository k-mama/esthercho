name: Accessibility Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/accessibility-baseline.mjs
      - .github/workflows/accessibility-baseline.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Install pinned accessibility runtime
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1 @axe-core/playwright@4.12.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/esther-a11y-server.log 2>&1 &
          echo $! > /tmp/esther-a11y-server.pid
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/home/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/esther-a11y-server.log
          exit 1

      - name: Capture accessibility baseline
        env:
          A11Y_BASE_URL: http://127.0.0.1:4173
        run: node scripts/accessibility-baseline.mjs

      - name: Upload accessibility baseline
        uses: actions/upload-artifact@v5
        with:
          name: accessibility-baseline-${{ github.sha }}
          path: .reports/accessibility/
          retention-days: 30
          include-hidden-files: true
